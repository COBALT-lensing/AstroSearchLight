[project]
name = "lc-filter"
version = "0.1.0"
description = ""
authors = [
    {name = "Adam McMaster",email = "me@adam-mcmaster.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ipywidgets (>=8.1.8,<9.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "lightkurve (>=2.5.1,<3.0.0)",
    "xgboost (>=3.1.3,<4.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "upsilont @ git+https://github.com/COBALT-lensing/UPSILoN-T",
    "pyfftw (>=0.15.1,<0.16.0)",
    "compress-pickle (>=2.1.0,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
torch = [
    {version = ">=2.9.1,<3.0.0", markers = "sys_platform != 'linux'"},
    {version = "2.9.1+cpu", markers = "sys_platform == 'linux' and extra != 'cuda'", source = "pytorch-cpu"},
    {version = "2.9.1+cu128", markers = "sys_platform == 'linux' and extra == 'cuda'", source = "pytorch-cu128"},
]
torchvision = [
    {version = ">=0.24.1,<0.26.0", markers = "sys_platform != 'linux'"},
    {version = "0.24.1+cpu", markers = "sys_platform == 'linux' and extra != 'cuda'", source = "pytorch-cpu"},
    {version = "0.24.1+cu128", markers = "sys_platform == 'linux' and extra == 'cuda'", source = "pytorch-cu128"},
]

[project.optional-dependencies]
cuda = []

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"
