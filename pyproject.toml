[project]
name = "searchlight"
version = "0.1.0"
description = ""
authors = [
    {name = "Adam McMaster",email = "me@adam-mcmaster.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ipywidgets>=8.1.8,<9.0.0",
    "torch>=2.9.1,<3.0.0",
    "matplotlib>=3.10.8,<4.0.0",
    "torchvision>=0.24.1,<0.26.0",
    "lightkurve>=2.5.1,<3.0.0",
    "xgboost>=3.1.3,<4.0.0",
    "scipy>=1.17.0,<2.0.0",
    "upsilont @ git+https://github.com/COBALT-lensing/UPSILoN-T",
    "pyfftw>=0.15.1,<0.16.0",
    "compress-pickle>=2.1.0,<3.0.0",
    "seaborn>=0.13.2,<0.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0,<8.0.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searchlight"]

[tool.hatch.metadata]
allow-direct-references = true
