name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Use HTTPS for the public selflensing dependency
        run: git config --global url."https://github.com/COBALT-lensing/py-self-lensing.git".insteadOf "ssh://git@github.com/COBALT-lensing/py-self-lensing.git"

      - name: Install dependencies
        run: uv sync --locked --all-groups --extra evaluation --extra template-generation

      - name: Verify physics dependencies
        run: uv run --no-sync python -c "import selflensing, rustlens, jaxoplanet"

      - name: Run tests
        run: uv run --no-sync pytest
